[global]
; Log to the container's stderr rather than /usr/local/var/log, which isn't writable when the
; container runs as a non-root user or with a read-only root filesystem.
error_log = /proc/self/fd/2

[www]

user = nginx
group = nginx

listen = 127.0.0.1:9000
listen.owner = nginx
listen.group = nginx
listen.mode = 0750

pm = ondemand
pm.max_children = 9
pm.process_idle_timeout = 10s
pm.max_requests = 200

clear_env = no